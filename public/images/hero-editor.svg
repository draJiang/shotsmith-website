<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>Shotsmith editor annotating a screenshot</title>
  <defs>
    <filter id="win" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#141418" flood-opacity="0.16"/>
    </filter>
    <filter id="bar" x="-10%" y="-40%" width="120%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#141418" flood-opacity="0.28"/>
    </filter>
    <pattern id="mosaic" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#C9CAD1"/><rect x="9" width="9" height="9" fill="#E3E4E8"/>
      <rect y="9" width="9" height="9" fill="#DADBE0"/><rect x="9" y="9" width="9" height="9" fill="#BFC0C8"/>
    </pattern>
    <marker id="head" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#F2512D"/>
    </marker>
  </defs>

  <!-- 被截图的窗口 -->
  <g filter="url(#win)">
    <rect x="40" y="20" width="960" height="540" rx="14" fill="#FFFFFF"/>
  </g>
  <path d="M54 20 H986 A14 14 0 0 1 1000 34 V64 H40 V34 A14 14 0 0 1 54 20 Z" fill="#F4F4F6"/>
  <line x1="40" y1="64" x2="1000" y2="64" stroke="#E6E6EA"/>
  <circle cx="66" cy="42" r="6" fill="#FF5F57"/><circle cx="86" cy="42" r="6" fill="#FEBC2E"/><circle cx="106" cy="42" r="6" fill="#28C840"/>
  <text x="520" y="47" text-anchor="middle" font-size="13" fill="#6B6B75">Launch Plan</text>

  <!-- 侧边栏 -->
  <path d="M40 64 H230 V560 H54 A14 14 0 0 1 40 546 Z" fill="#FAFAFB"/>
  <line x1="230" y1="64" x2="230" y2="560" stroke="#EDEDF0"/>
  <g fill="#D6D7DD">
    <rect x="64" y="96" width="110" height="10" rx="5"/>
    <rect x="64" y="128" width="140" height="28" rx="7" fill="#ECECF0"/>
    <rect x="76" y="137" width="90" height="10" rx="5"/>
    <rect x="76" y="176" width="100" height="10" rx="5"/>
    <rect x="76" y="206" width="76" height="10" rx="5"/>
    <rect x="76" y="236" width="112" height="10" rx="5"/>
    <rect x="64" y="290" width="80" height="10" rx="5"/>
    <rect x="76" y="320" width="96" height="10" rx="5"/>
    <rect x="76" y="350" width="70" height="10" rx="5"/>
  </g>

  <!-- 正文 -->
  <text x="270" y="124" font-size="28" font-weight="700" fill="#141418">Launch checklist</text>
  <g fill="#DCDDE2">
    <rect x="270" y="150" width="380" height="11" rx="5.5"/>
    <rect x="270" y="172" width="330" height="11" rx="5.5"/>
  </g>
  <!-- 被打码的邮箱 -->
  <text x="270" y="219" font-size="15" fill="#6B6B75">Owner:</text>
  <rect x="326" y="203" width="196" height="22" rx="4" fill="url(#mosaic)"/>

  <!-- 图表卡片 -->
  <rect x="270" y="252" width="400" height="240" rx="12" fill="#FAFAFB" stroke="#EDEDF0"/>
  <text x="294" y="286" font-size="15" font-weight="600" fill="#141418">Weekly sign-ups</text>
  <g fill="#C9CAD1">
    <rect x="300" y="404" width="34" height="60" rx="5"/>
    <rect x="352" y="384" width="34" height="80" rx="5"/>
    <rect x="404" y="364" width="34" height="100" rx="5"/>
    <rect x="456" y="378" width="34" height="86" rx="5"/>
    <rect x="508" y="340" width="34" height="124" rx="5"/>
    <rect x="560" y="312" width="34" height="152" rx="5" fill="#141418"/>
  </g>
  <line x1="294" y1="465" x2="646" y2="465" stroke="#E2E3E8"/>

  <!-- 右栏任务 -->
  <g font-size="15" fill="#141418">
    <rect x="712" y="252" width="16" height="16" rx="4" fill="#141418"/>
    <path d="M716 260 l3 3 l6 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="740" y="266">Record the demo</text>
    <rect x="712" y="290" width="16" height="16" rx="4" fill="none" stroke="#B9BAC2" stroke-width="1.6"/>
    <text x="740" y="304">Write release notes</text>
    <rect x="712" y="328" width="16" height="16" rx="4" fill="none" stroke="#B9BAC2" stroke-width="1.6"/>
    <text x="740" y="342">Update screenshots</text>
  </g>
  <g fill="#DCDDE2">
    <rect x="712" y="380" width="250" height="11" rx="5.5"/>
    <rect x="712" y="402" width="210" height="11" rx="5.5"/>
    <rect x="712" y="424" width="232" height="11" rx="5.5"/>
  </g>

  <!-- 标注 -->
  <rect x="548" y="300" width="58" height="176" rx="8" fill="none" stroke="#F2512D" stroke-width="4"/>
  <path d="M800 470 C 760 520, 680 520, 620 470" fill="none" stroke="#F2512D" stroke-width="5" stroke-linecap="round" marker-end="url(#head)"/>
  <text x="808" y="500" font-size="20" font-weight="700" fill="#F2512D">+38% this week</text>
  <g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="686" cy="298" r="14" fill="#F2512D"/><text x="686" y="303">1</text>
    <circle cx="686" cy="336" r="14" fill="#F2512D"/><text x="686" y="341">2</text>
  </g>

  <!-- 浮动工具栏 -->
  <g filter="url(#bar)">
    <rect x="242" y="584" width="482" height="52" rx="12" fill="#1C1C22"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- 裁剪 -->
    <path d="M260 600 v20 h20 M264 604 h20 v20"/>
    <!-- 箭头（选中） -->
    <rect x="292" y="594" width="34" height="32" rx="7" fill="#F2512D" stroke="none"/>
    <path d="M302 618 L316 604 M308 604 h8 v8" stroke="#fff"/>
    <!-- 矩形 -->
    <rect x="340" y="602" width="18" height="16" rx="3"/>
    <!-- 文字 -->
    <path d="M378 602 h16 M386 602 v18"/>
    <!-- 编号 -->
    <circle cx="420" cy="610" r="9"/>
    <path d="M418 606 l2 -1 v10"/>
    <!-- 马赛克 -->
    <path d="M444 602 h16 v16 h-16 Z M452 602 v16 M444 610 h16"/>
    <!-- 背景 -->
    <rect x="476" y="602" width="20" height="16" rx="3"/>
    <path d="M480 614 l4 -4 l3 3 l3 -3 l4 4"/>
  </g>
  <line x1="514" y1="598" x2="514" y2="622" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- 工作流 ⚡ -->
    <path d="M538 598 l-8 13 h7 l-2 11 l9 -14 h-7 Z" fill="#FFFFFF" stroke="none"/>
    <path d="M552 608 l3 3 l3 -3" stroke-width="1.6"/>
    <!-- 钉图 -->
    <path d="M584 600 l8 8 M580 610 l10 -6 l-4 10 Z M582 616 l-4 4"/>
    <!-- 保存 -->
    <path d="M620 600 v14 M614 609 l6 6 l6 -6 M612 620 h16"/>
    <!-- 复制 -->
    <rect x="648" y="603" width="13" height="15" rx="3"/>
    <path d="M653 603 v-3 a2 2 0 0 1 2 -2 h9 a2 2 0 0 1 2 2 v11 a2 2 0 0 1 -2 2 h-3"/>
    <!-- 关闭 -->
    <path d="M688 603 l12 12 M700 603 l-12 12"/>
  </g>
</svg>
