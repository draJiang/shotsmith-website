<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>A workflow that reads text from a screenshot, asks an LLM, and copies the answer</title>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#141418" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="frame"><rect width="560" height="480" rx="20"/></clipPath>
    <filter id="node" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#141418" flood-opacity="0.1"/>
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="560" height="480" fill="#F4F4F6"/>
    <rect width="560" height="480" fill="url(#dots)"/>

    <!-- 连线 -->
    <g fill="none" stroke-width="2.5" stroke-linecap="round">
      <path d="M190 100 C 240 100, 222 182, 270 182" stroke="#8B5CF6"/>
      <path d="M446 182 C 496 182, 486 240, 420 252 C 340 266, 150 254, 150 292" stroke="#10B39A"/>
      <path d="M262 324 C 300 324, 296 324, 330 324" stroke="#10B39A"/>
    </g>

    <!-- 节点 -->
    <g filter="url(#node)">
      <rect x="36" y="68" width="154" height="64" rx="12" fill="#FFFFFF"/>
      <rect x="270" y="150" width="176" height="64" rx="12" fill="#FFFFFF"/>
      <rect x="40" y="292" width="222" height="64" rx="12" fill="#FFFFFF"/>
      <rect x="330" y="292" width="190" height="64" rx="12" fill="#FFFFFF"/>
    </g>
    <g font-size="14" font-weight="600" fill="#141418">
      <rect x="50" y="84" width="32" height="32" rx="8" fill="#141418"/>
      <path d="M58 94 h6 M58 94 v6 M74 106 h-6 M74 106 v-6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="92" y="98">Screenshot</text>
      <text x="92" y="116" font-size="11" font-weight="400" fill="#8A8A94">Trigger</text>

      <rect x="284" y="166" width="32" height="32" rx="8" fill="#E7F7F3"/>
      <path d="M292 176 h16 M292 182 h12 M292 188 h14" stroke="#10B39A" stroke-width="2" stroke-linecap="round"/>
      <text x="326" y="180">Recognize Text</text>
      <text x="326" y="198" font-size="11" font-weight="400" fill="#8A8A94">OCR · on device</text>

      <rect x="54" y="308" width="32" height="32" rx="8" fill="#F1ECFE"/>
      <path d="M70 314 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5 Z" fill="#8B5CF6"/>
      <text x="96" y="322">Ask LLM</text>
      <text x="96" y="340" font-size="11" font-weight="400" fill="#8A8A94">“Translate to English”</text>

      <rect x="344" y="308" width="32" height="32" rx="8" fill="#FDE7E1"/>
      <rect x="353" y="317" width="12" height="15" rx="2.5" fill="none" stroke="#F2512D" stroke-width="2"/>
      <path d="M357 317 v-2 a2 2 0 0 1 2 -2 h8 a2 2 0 0 1 2 2 v11 a2 2 0 0 1 -2 2 h-2" fill="none" stroke="#F2512D" stroke-width="2"/>
      <text x="386" y="322">Copy to Clipboard</text>
      <text x="386" y="340" font-size="11" font-weight="400" fill="#8A8A94">Then show a HUD</text>
    </g>
    <g>
      <circle cx="190" cy="100" r="5" fill="#8B5CF6" stroke="#fff" stroke-width="2"/>
      <circle cx="270" cy="182" r="5" fill="#8B5CF6" stroke="#fff" stroke-width="2"/>
      <circle cx="446" cy="182" r="5" fill="#10B39A" stroke="#fff" stroke-width="2"/>
      <circle cx="150" cy="292" r="5" fill="#10B39A" stroke="#fff" stroke-width="2"/>
      <circle cx="262" cy="324" r="5" fill="#10B39A" stroke="#fff" stroke-width="2"/>
      <circle cx="330" cy="324" r="5" fill="#10B39A" stroke="#fff" stroke-width="2"/>
    </g>

    <!-- 命令行 -->
    <rect x="36" y="384" width="488" height="68" rx="12" fill="#141418"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12.5">
      <text x="54" y="412" fill="#8A8A94">$ <tspan fill="#FFFFFF">shotsmith workflow create spec.json</tspan></text>
      <text x="54" y="434" fill="#28C840">✓ <tspan fill="#C9CAD1">Created “Translate Screenshot” · ⌘3</tspan></text>
    </g>
    <rect x="466" y="398" width="42" height="20" rx="5" fill="none" stroke="#F2512D" stroke-width="1.5"/>
    <text x="487" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#F2512D">PRO</text>
  </g>
</svg>
