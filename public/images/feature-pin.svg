<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>A pinned screenshot over the screenshot history</title>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9EAF0"/><stop offset="1" stop-color="#D5D7E0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="560" height="480" rx="20"/></clipPath>
    <filter id="float" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#141418" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="560" height="480" fill="url(#desk)"/>

    <!-- 截图历史 -->
    <rect x="36" y="40" width="380" height="400" rx="12" fill="#FFFFFF"/>
    <rect x="36" y="40" width="380" height="40" rx="12" fill="#F4F4F6"/>
    <rect x="36" y="68" width="380" height="12" fill="#F4F4F6"/>
    <circle cx="58" cy="60" r="5" fill="#FF5F57"/><circle cx="74" cy="60" r="5" fill="#FEBC2E"/><circle cx="90" cy="60" r="5" fill="#28C840"/>
    <text x="226" y="65" text-anchor="middle" font-size="12" fill="#6B6B75">Screenshot History</text>
    <rect x="56" y="96" width="340" height="30" rx="8" fill="#F1F1F4"/>
    <circle cx="74" cy="110" r="6" fill="none" stroke="#8A8A94" stroke-width="1.8"/>
    <path d="M78.5 114.5 l4 4" stroke="#8A8A94" stroke-width="1.8" stroke-linecap="round"/>
    <text x="90" y="116" font-size="13" fill="#141418">invoice</text>
    <rect x="137" y="102" width="1.5" height="17" fill="#F2512D"/>

    <g>
      <rect x="56" y="142" width="104" height="80" rx="8" fill="#ECECF0" stroke="#F2512D" stroke-width="3"/>
      <rect x="68" y="156" width="56" height="8" rx="4" fill="#C9CAD1"/>
      <rect x="68" y="172" width="78" height="8" rx="4" fill="#F2512D" fill-opacity="0.35"/>
      <rect x="68" y="188" width="64" height="8" rx="4" fill="#C9CAD1"/>
      <rect x="174" y="142" width="104" height="80" rx="8" fill="#ECECF0"/>
      <rect x="186" y="156" width="80" height="44" rx="5" fill="#DADBE0"/>
      <rect x="292" y="142" width="104" height="80" rx="8" fill="#ECECF0"/>
      <circle cx="344" cy="182" r="20" fill="#DADBE0"/>
      <rect x="56" y="236" width="104" height="80" rx="8" fill="#ECECF0"/>
      <rect x="68" y="250" width="80" height="8" rx="4" fill="#C9CAD1"/><rect x="68" y="266" width="60" height="8" rx="4" fill="#C9CAD1"/>
      <rect x="174" y="236" width="104" height="80" rx="8" fill="#ECECF0"/>
      <rect x="292" y="236" width="104" height="80" rx="8" fill="#ECECF0"/>
      <rect x="306" y="250" width="76" height="52" rx="5" fill="#DADBE0"/>
    </g>
    <g font-size="11" fill="#6B6B75">
      <text x="56" y="336">Safari · 2 min ago</text>
      <text x="56" y="352" fill="#F2512D" font-weight="600">“Invoice #2041” found in text</text>
    </g>
    <g fill="#E4E5EA"><rect x="56" y="372" width="340" height="10" rx="5"/><rect x="56" y="392" width="240" height="10" rx="5"/></g>

    <!-- 钉在屏幕上的截图 -->
    <g filter="url(#float)" opacity="0.92">
      <rect x="300" y="178" width="224" height="170" rx="10" fill="#FFFFFF"/>
    </g>
    <rect x="300" y="178" width="224" height="170" rx="10" fill="none" stroke="#F2512D" stroke-width="2"/>
    <text x="318" y="208" font-size="14" font-weight="700" fill="#141418">API keys</text>
    <g fill="#DCDDE2"><rect x="318" y="220" width="170" height="8" rx="4"/><rect x="318" y="236" width="140" height="8" rx="4"/></g>
    <rect x="318" y="256" width="188" height="26" rx="6" fill="#F4F4F6"/>
    <text x="328" y="273" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#55555E">sk-live-••••••••••4f2a</text>
    <g fill="#DCDDE2"><rect x="318" y="294" width="150" height="8" rx="4"/><rect x="318" y="310" width="110" height="8" rx="4"/></g>
    <rect x="474" y="190" width="40" height="20" rx="6" fill="#141418" fill-opacity="0.8"/>
    <text x="494" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">92%</text>
    <circle cx="300" cy="178" r="13" fill="#F2512D"/>
    <path d="M296 182 l8 -8 M299 171 l10 10 M303 175 l-1.5 5.5 l-5.5 1.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
