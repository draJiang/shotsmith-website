<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>Selecting a region to capture</title>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9EAF0"/><stop offset="1" stop-color="#D5D7E0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="560" height="480" rx="20"/></clipPath>
    <mask id="hole">
      <rect width="560" height="480" fill="#fff"/>
      <rect x="120" y="96" width="316" height="214" rx="2" fill="#000"/>
    </mask>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="560" height="480" fill="url(#desk)"/>
    <!-- 桌面上的窗口 -->
    <rect x="60" y="54" width="440" height="330" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="54" width="440" height="36" rx="12" fill="#F4F4F6"/>
    <rect x="60" y="78" width="440" height="12" fill="#F4F4F6"/>
    <circle cx="82" cy="72" r="5" fill="#FF5F57"/><circle cx="98" cy="72" r="5" fill="#FEBC2E"/><circle cx="114" cy="72" r="5" fill="#28C840"/>
    <rect x="140" y="118" width="150" height="14" rx="7" fill="#141418"/>
    <g fill="#DCDDE2">
      <rect x="140" y="146" width="270" height="10" rx="5"/>
      <rect x="140" y="166" width="230" height="10" rx="5"/>
    </g>
    <rect x="140" y="194" width="130" height="96" rx="10" fill="#FCE3DC"/>
    <circle cx="205" cy="242" r="26" fill="#F2512D"/>
    <rect x="286" y="194" width="130" height="96" rx="10" fill="#ECECF0"/>
    <g fill="#C9CAD1"><rect x="302" y="252" width="16" height="26" rx="3"/><rect x="326" y="236" width="16" height="42" rx="3"/><rect x="350" y="220" width="16" height="58" rx="3"/><rect x="374" y="244" width="16" height="34" rx="3"/></g>
    <g fill="#DCDDE2"><rect x="96" y="330" width="300" height="10" rx="5"/><rect x="96" y="350" width="220" height="10" rx="5"/></g>

    <!-- 截图遮罩和选区 -->
    <rect width="560" height="480" fill="#141418" fill-opacity="0.42" mask="url(#hole)"/>
    <rect x="120" y="96" width="316" height="214" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <g fill="#FFFFFF" stroke="#141418" stroke-opacity="0.25">
      <circle cx="120" cy="96" r="5"/><circle cx="436" cy="96" r="5"/><circle cx="120" cy="310" r="5"/><circle cx="436" cy="310" r="5"/>
      <circle cx="278" cy="96" r="4"/><circle cx="278" cy="310" r="4"/><circle cx="120" cy="203" r="4"/><circle cx="436" cy="203" r="4"/>
    </g>
    <rect x="120" y="66" width="92" height="22" rx="6" fill="#141418" fill-opacity="0.85"/>
    <text x="166" y="81" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">632 × 428</text>

    <!-- 截图方式 -->
    <rect x="96" y="404" width="368" height="44" rx="12" fill="#1C1C22"/>
    <rect x="102" y="410" width="84" height="32" rx="8" fill="#F2512D"/>
    <g font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      <text x="144" y="431">Region</text>
      <text x="230" y="431" fill-opacity="0.75">Window</text>
      <text x="318" y="431" fill-opacity="0.75">Scrolling</text>
      <text x="410" y="431" fill-opacity="0.75">Record</text>
    </g>
  </g>
</svg>
